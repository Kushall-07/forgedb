# Phase 14's three-node development/demo cluster. See
# docs/deployment/phase14-docker-deployment.md for the full operational
# guide (startup, health, leader discovery, failure testing, persistence,
# reset). Every node:
#   - runs the same image, built from ./Dockerfile
#   - gets its own NODE_ID, its own persistent named volume at /data, and
#     its own host-exposed HTTP/gRPC ports
#   - shares the same PEERS roster and the same forgedb-net network, and
#     addresses its peers by Compose service name (forgedb-1/2/3), never
#     by localhost or a hard-coded IP -- see that doc's "network" section
#     for why that distinction is load-bearing here.
#
# `docker compose up -d` starts all three; `docker compose down` stops
# them and PRESERVES the named volumes (your data survives). Only
# `docker compose down -v` deletes the volumes -- see the deployment doc
# before ever running that.

x-peers: &peers
  PEERS: "node-1=forgedb-1:9090|forgedb-1:8080,node-2=forgedb-2:9090|forgedb-2:8080,node-3=forgedb-3:9090|forgedb-3:8080"

# FORGEDB_API_TOKEN is the static bearer token every protected HTTP
# endpoint requires (see internal/api/auth.go / internal/config's
# FORGEDB_API_TOKEN doc comment). It is never given a default here --
# ${VAR:?msg} makes `docker compose up`/`docker compose config` fail
# immediately with msg if FORGEDB_API_TOKEN is not set in the shell
# environment (or a local, untracked .env file -- see .env.example),
# the same "fail fast rather than run unauthenticated" rule
# config.Config.Validate() enforces inside the Go process itself. Do not
# put a real token directly in this file.
x-api-token: &api_token
  FORGEDB_API_TOKEN: ${FORGEDB_API_TOKEN:?FORGEDB_API_TOKEN must be set -- see .env.example}

services:
  forgedb-1:
    build: .
    image: forgedb:latest
    container_name: forgedb-1
    hostname: forgedb-1
    environment:
      <<: [*peers, *api_token]
      NODE_ID: node-1
      HTTP_ADDR: 0.0.0.0:8080
      GRPC_ADDR: 0.0.0.0:9090
      DATA_DIR: /data
      LOG_LEVEL: info
    ports:
      - "8081:8080"
      - "9091:9090"
    volumes:
      - forgedb-node1-data:/data
    networks:
      - forgedb-net
    restart: unless-stopped

  forgedb-2:
    build: .
    image: forgedb:latest
    container_name: forgedb-2
    hostname: forgedb-2
    environment:
      <<: [*peers, *api_token]
      NODE_ID: node-2
      HTTP_ADDR: 0.0.0.0:8080
      GRPC_ADDR: 0.0.0.0:9090
      DATA_DIR: /data
      LOG_LEVEL: info
    ports:
      - "8082:8080"
      - "9092:9090"
    volumes:
      - forgedb-node2-data:/data
    networks:
      - forgedb-net
    restart: unless-stopped

  forgedb-3:
    build: .
    image: forgedb:latest
    container_name: forgedb-3
    hostname: forgedb-3
    environment:
      <<: [*peers, *api_token]
      NODE_ID: node-3
      HTTP_ADDR: 0.0.0.0:8080
      GRPC_ADDR: 0.0.0.0:9090
      DATA_DIR: /data
      LOG_LEVEL: info
    ports:
      - "8083:8080"
      - "9093:9090"
    volumes:
      - forgedb-node3-data:/data
    networks:
      - forgedb-net
    restart: unless-stopped

  # forge-gateway is the public HTTP entrypoint's stable, leader-aware
  # target: a small reverse proxy (internal/gateway) that forwards every
  # request to whichever node currently identifies itself as the Raft
  # leader, following that node's own not-leader hint when it isn't --
  # see docs/deployment/phase15-leader-aware-gateway.md. Point Caddy's
  # upstream at forge-gateway:8090 (see deploy/Caddyfile.example)
  # instead of any single forgedb-N node, so a leader election never
  # requires editing the public-facing proxy's configuration.
  #
  # It deliberately gets neither FORGEDB_API_TOKEN nor any other secret:
  # it forwards whatever Authorization header a client already sent,
  # unchanged, straight through to whichever node answers -- that node's
  # own authMiddleware (internal/api/auth.go) is still the only thing
  # that ever validates it.
  forge-gateway:
    build: .
    image: forgedb:latest
    container_name: forge-gateway
    hostname: forge-gateway
    entrypoint: ["forge-gateway"]
    environment:
      <<: [*peers]
      GATEWAY_ADDR: 0.0.0.0:8090
    ports:
      - "8090:8090"
    networks:
      - forgedb-net
    depends_on:
      - forgedb-1
      - forgedb-2
      - forgedb-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

networks:
  forgedb-net:
    driver: bridge

volumes:
  forgedb-node1-data:
  forgedb-node2-data:
  forgedb-node3-data:
